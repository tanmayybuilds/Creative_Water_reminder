[package]
name = "lockin"
version = "0.1.0"
description = "100% local, open-source desktop break-taker application"
authors = ["LOCKIN Contributors"]
license = "MIT"
repository = "https://github.com/tanmay/lockin"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lockin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-notification = "2"
